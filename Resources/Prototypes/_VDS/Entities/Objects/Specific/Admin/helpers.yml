- type: entity
  parent: BaseItem
  id: AdminSpeaker
  name: ...
  description: Talk to the living through the osay command.
  components:
  - type: Sprite
    sprite: Objects/Misc/coins.rsi
    layers:
    - state: coin_diamond
      color: blue
      shader: unshaded
  - type: Input
    context: "human"
  - type: BlockMovement
  - type: Examiner
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    receiveAllChannels: true
    globalReceive: true
  - type: DoAfter
  - type: Actions
  - type: Emoting
  - type: Speech
    speechSounds: Bass
  - type: MobState
    allowedStates:
      - Alive
  - type: Appearance
  - type: Vocal
  - type: IntrinsicRadioTransmitter
    channels:
    - Common
    - CentCom
    - Engineering
    - Service
    - Security
    - Science
    - Medical
    - Handheld
    - Syndicate
    - Freelance
    - Binary

- type: entity
  id: HandTunnelerAdmeme
  suffix: Admeme
  parent: BaseItem
  name: interdimensional tunneler
  description: Allows you to open stable holes that are not limited by distance.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrilldiamond.rsi
    layers:
    - state: handdrill
      color: green
  - type: HandTeleporter
    newPortalSound: /Audio/_VDS/Ambience/Tense/thud4.ogg
    clearPortalSound: /Audio/_VDS/Ambience/Tense/thud4.ogg
    allowPortalsOnDifferentGrids: true
    allowPortalsOnDifferentMaps: true
    firstPortalPrototype: PortalFloorChasm
    secondPortalPrototype: PortalFloorChasm
